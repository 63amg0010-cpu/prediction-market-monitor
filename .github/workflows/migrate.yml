name: migrate
run-name: migrate-${{ inputs.operation }}-${{ inputs.revision }}-${{ inputs.dispatch_nonce }}-attempt-${{ inputs.attempt }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Exact migration operation
        required: true
        type: string
      revision:
        description: Exact reviewed Alembic revision
        required: true
        type: string
      attempt:
        description: Immutable attempt number (1 or 2)
        required: true
        type: number
      expected_commit_sha:
        description: Full reviewed commit SHA
        required: true
        type: string
      confirm:
        description: Exact tuple-specific confirmation
        required: true
        type: string
      activation_nonce:
        description: Root activation UUID
        required: true
        type: string
      dispatch_nonce:
        description: Fresh workflow dispatch UUID
        required: true
        type: string
      expected_plan_sha256:
        description: Approved plan SHA-256
        required: true
        type: string
      review_root_sha256:
        description: Bootstrap review-root SHA-256 or empty
        required: false
        default: ""
        type: string
      review_root_b64:
        description: Bootstrap public-safe canonical review root or empty
        required: false
        default: ""
        type: string
      no_spend_receipt_sha256:
        description: Bootstrap no-spend receipt SHA-256 or empty
        required: false
        default: ""
        type: string
      no_spend_receipt_b64:
        description: Bootstrap public-safe canonical no-spend receipt or empty
        required: false
        default: ""
        type: string
      attempt1_failed_receipt_sha256:
        description: Attempt-1 failed receipt SHA-256 or empty
        required: false
        default: ""
        type: string
      attempt1_failed_receipt_b64:
        description: Attempt-1 public-safe canonical failed receipt or empty
        required: false
        default: ""
        type: string
      attestation_run_id:
        description: Completed attestation run ID for 0011 only
        required: false
        default: ""
        type: string
      attestation_generation:
        description: Completed attestation generation for 0011 only
        required: false
        default: 0
        type: number
      attestation_dispatch_nonce:
        description: Completed activation-evidence dispatch UUID for 0011 only
        required: false
        default: ""
        type: string
      attestation_sha256:
        description: Completed attestation SHA-256 for 0011 only
        required: false
        default: ""
        type: string
      reservation_sha256:
        description: Claimed durable reservation SHA-256; empty only for bootstrap
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-migration
    env:
      OPERATION: ${{ inputs.operation }}
      REVISION: ${{ inputs.revision }}
      ATTEMPT: ${{ inputs.attempt }}
      EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
      CONFIRM: ${{ inputs.confirm }}
      ACTIVATION_NONCE: ${{ inputs.activation_nonce }}
      DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
      EXPECTED_PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
      REVIEW_ROOT_SHA256: ${{ inputs.review_root_sha256 }}
      REVIEW_ROOT_B64: ${{ inputs.review_root_b64 }}
      NO_SPEND_RECEIPT_SHA256: ${{ inputs.no_spend_receipt_sha256 }}
      NO_SPEND_RECEIPT_B64: ${{ inputs.no_spend_receipt_b64 }}
      ATTEMPT1_FAILED_RECEIPT_SHA256: ${{ inputs.attempt1_failed_receipt_sha256 }}
      ATTEMPT1_FAILED_RECEIPT_B64: ${{ inputs.attempt1_failed_receipt_b64 }}
      ATTESTATION_RUN_ID: ${{ inputs.attestation_run_id }}
      ATTESTATION_GENERATION: ${{ inputs.attestation_generation }}
      ATTESTATION_DISPATCH_NONCE: ${{ inputs.attestation_dispatch_nonce }}
      ATTESTATION_SHA256: ${{ inputs.attestation_sha256 }}
      RESERVATION_SHA256: ${{ inputs.reservation_sha256 }}
      GITHUB_EVENT_SHA: ${{ github.sha }}
      PYTHONPATH: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_commit_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.5.30"
      - run: uv sync --package monitor-api --locked
      - name: Validate immutable reviewed dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_SHA" = "$EXPECTED_COMMIT_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          uv run --package monitor-api python -m scripts.migration_dispatch_validator validate-dispatch
        env:
          DEFER_RESERVATION_CLAIM: "true"
      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version | grep -Eq '^pg_dump \(PostgreSQL\) 17\.'
      - name: Validate direct or session-mode database URLs without disclosure
        run: uv run --package monitor-api python -m scripts.migration_dispatch_validator validate-database-urls
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          PG_DUMP_DATABASE_URL: ${{ secrets.PG_DUMP_DATABASE_URL }}
          PG_RESTORE_DATABASE_URL: ${{ secrets.PG_RESTORE_DATABASE_URL }}
      - name: Validate repository migration head
        run: |
          set -euo pipefail
          uv run --package monitor-api alembic -c apps/api/alembic.ini heads > "$RUNNER_TEMP/alembic-heads.txt"
          HEADS_FILE="$RUNNER_TEMP/alembic-heads.txt" uv run --package monitor-api python -m scripts.migration_dispatch_validator validate-heads
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      - name: Validate safe starting revision
        run: |
          set -euo pipefail
          uv run --package monitor-api alembic -c apps/api/alembic.ini current > "$RUNNER_TEMP/alembic-current.txt"
          CURRENT_FILE="$RUNNER_TEMP/alembic-current.txt" uv run --package monitor-api python -m scripts.migration_dispatch_validator validate-current
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      - name: Validate bootstrap ledger boundary
        shell: bash
        run: |
          set -euo pipefail
          ledger_absent="$(psql "$PG_DUMP_DATABASE_URL" --no-psqlrc --tuples-only --no-align --command="SELECT to_regclass('public.release_roots') IS NULL")"
          receipt_chain_absent="$(psql "$PG_DUMP_DATABASE_URL" --no-psqlrc --tuples-only --no-align --command="SELECT to_regclass('public.release_receipt_chain') IS NULL")"
          if [ "$OPERATION:$REVISION" = "upgrade:20260727_0010" ]; then
            test "$ledger_absent" = "t"
          elif [ "$OPERATION:$REVISION" = "upgrade:20260803_0010a" ]; then
            test "$ledger_absent" = "f"
            test "$receipt_chain_absent" = "t"
          elif [ "$OPERATION:$REVISION" = "upgrade:20260803_0010b" ]; then
            test "$ledger_absent" = "f"
            test "$receipt_chain_absent" = "f"
          elif [ "$OPERATION:$REVISION" = "upgrade:20260803_0010c" ]; then
            test "$ledger_absent" = "f"
            test "$receipt_chain_absent" = "f"
          elif [ "$OPERATION:$REVISION" = "upgrade:20260803_0010d" ]; then
            test "$ledger_absent" = "f"
            test "$receipt_chain_absent" = "f"
          elif [ "$OPERATION:$REVISION" = "upgrade:20260803_0010e" ]; then
            test "$ledger_absent" = "f"
            test "$receipt_chain_absent" = "f"
          elif [ "$OPERATION:$REVISION" = "upgrade:20260803_0010f" ]; then
            test "$ledger_absent" = "f"
            test "$receipt_chain_absent" = "f"
          else
            test "$ledger_absent" = "f"
            test "$receipt_chain_absent" = "f"
          fi
        env:
          PG_DUMP_DATABASE_URL: ${{ secrets.PG_DUMP_DATABASE_URL }}
      - name: Verify completed 0011 attestation run identity
        if: ${{ inputs.operation == 'upgrade' && inputs.revision == '20260727_0011' }}
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${ATTESTATION_RUN_ID}" \
            > "$RUNNER_TEMP/attestation-run.json"
          jq -e \
            --arg sha "$EXPECTED_COMMIT_SHA" \
            '.event == "workflow_dispatch" and .head_sha == $sha and .conclusion == "success" and .path == ".github/workflows/activation-evidence.yml"' \
            "$RUNNER_TEMP/attestation-run.json" > /dev/null
          mkdir "$RUNNER_TEMP/attestation"
          artifact="activation-evidence-${ACTIVATION_NONCE}-generation-${ATTESTATION_GENERATION}-${ATTESTATION_DISPATCH_NONCE}-attempt-${ATTEMPT}"
          timeout 30s gh run download "$ATTESTATION_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact" \
            --dir "$RUNNER_TEMP/attestation"
          attestation="$RUNNER_TEMP/attestation/activation-attestation-generation-${ATTESTATION_GENERATION}.json"
          receipt="$RUNNER_TEMP/attestation/activation-evidence-public-receipt.json"
          test -f "$attestation"
          test -f "$receipt"
          claim="$RUNNER_TEMP/attestation/workflow-claim-public-receipt.json"
          test -f "$claim"
          operation_receipt="$RUNNER_TEMP/attestation/operation.json"
          test -f "$operation_receipt"
          test "$(find "$RUNNER_TEMP/attestation" -type f | wc -l)" -eq 4
          test "$(sha256sum "$attestation" | cut -d' ' -f1)" = "$ATTESTATION_SHA256"
          jq -e \
            --arg nonce "$ACTIVATION_NONCE" \
            --argjson generation "$ATTESTATION_GENERATION" \
            --arg dispatch "$ATTESTATION_DISPATCH_NONCE" \
            --argjson attempt "$ATTEMPT" \
            --arg sha "$ATTESTATION_SHA256" \
            '.activation_nonce == $nonce and .attestation_generation == $generation and .dispatch_nonce == $dispatch and .attempt == $attempt and .attestation_sha256 == $sha' \
            "$receipt" > /dev/null
          activation_reservation_sha256="$(jq -er '.reservation_receipt_sha256' "$receipt")"
          jq -e \
            --arg reservation_sha256 "$activation_reservation_sha256" \
            --argjson run_id "$ATTESTATION_RUN_ID" \
            '.command == "workflow-dispatch-claim" and .reservation_sha256 == $reservation_sha256 and .run_id == $run_id and .accepted == true' \
            "$claim" > /dev/null
          jq -e \
            --arg reservation_sha256 "$activation_reservation_sha256" \
            --argjson run_id "$ATTESTATION_RUN_ID" \
            '.command == "activation-evidence" and .reservation_receipt_sha256 == $reservation_sha256 and .run_id == $run_id and .accepted == true and .terminal_for_attempt == true' \
            "$operation_receipt" > /dev/null
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Claim durable workflow reservation
        if: ${{ inputs.reservation_sha256 != '' }}
        shell: bash
        env:
          CLAIM_ENVIRONMENT: '"production-migration"'
          DISPLAY_TITLE: migrate-${{ inputs.operation }}-${{ inputs.revision }}-${{ inputs.dispatch_nonce }}-attempt-${{ inputs.attempt }}
          MONITOR_API_URL: ${{ vars.MONITOR_API_URL }}
          WORKFLOW_FILE: migrate.yml
        run: |
          set -euo pipefail
          umask 077
          token_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=monitor-control")"
          oidc_token="$(jq -er '.value' <<<"$token_response")"
          jq -cn \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$WORKFLOW_FILE" \
            --arg display_title "$DISPLAY_TITLE" \
            --arg head_sha "$EXPECTED_COMMIT_SHA" \
            --arg approved_plan_sha256 "$EXPECTED_PLAN_SHA256" \
            --arg activation_nonce "$ACTIVATION_NONCE" \
            --arg dispatch_nonce "$DISPATCH_NONCE" \
            --arg reservation_sha256 "$RESERVATION_SHA256" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg ref "$GITHUB_REF" \
            --argjson environment "$CLAIM_ENVIRONMENT" \
            '{repository:$repository,workflow:$workflow,display_title:$display_title,head_sha:$head_sha,approved_plan_sha256:$approved_plan_sha256,activation_nonce:$activation_nonce,dispatch_nonce:$dispatch_nonce,reservation_sha256:$reservation_sha256,run_id:$run_id,run_attempt:$run_attempt,event:$event,ref:$ref,environment:$environment}' \
            > "$RUNNER_TEMP/workflow-claim-request.json"
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/workflow-claim-request.json" \
            "${MONITOR_API_URL}/internal/release/workflow-dispatch-claim" \
            > "$RUNNER_TEMP/workflow-claim-public-receipt.json"
          jq -e \
            --arg reservation_sha256 "$RESERVATION_SHA256" \
            --argjson run_id "$GITHUB_RUN_ID" \
            '.command == "workflow-dispatch-claim" and .reservation_sha256 == $reservation_sha256 and .run_id == $run_id and .accepted == true' \
            "$RUNNER_TEMP/workflow-claim-public-receipt.json" > /dev/null
          rm -f "$RUNNER_TEMP/workflow-claim-request.json"
      - name: Verify claimed durable reservation
        if: ${{ inputs.reservation_sha256 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          claimed="$(printf '%s\n' "SELECT count(*) = 1 FROM release_operation_reservations WHERE activation_nonce = :'activation_nonce'::uuid AND dispatch_nonce = :'dispatch_nonce'::uuid AND receipt_sha256 = :'reservation_sha256' AND claimed_run_id = :'run_id'::bigint;" \
            | psql "$PG_DUMP_DATABASE_URL" --no-psqlrc --tuples-only --no-align \
            --set=activation_nonce="$ACTIVATION_NONCE" \
            --set=dispatch_nonce="$DISPATCH_NONCE" \
            --set=reservation_sha256="$RESERVATION_SHA256" \
            --set=run_id="$GITHUB_RUN_ID")"
          test "$claimed" = "t"
          CLAIMED_RESERVATION_SHA256="$RESERVATION_SHA256" \
            uv run --package monitor-api python -m scripts.migration_dispatch_validator validate-dispatch
        env:
          PG_DUMP_DATABASE_URL: ${{ secrets.PG_DUMP_DATABASE_URL }}
      - name: Export pre-migration backup
        run: pg_dump --format=custom --no-owner --no-acl --file="$RUNNER_TEMP/pre-migration.dump" "$PG_DUMP_DATABASE_URL"
        env:
          PG_DUMP_DATABASE_URL: ${{ secrets.PG_DUMP_DATABASE_URL }}
      - name: Install pinned age release
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/age.tar.gz" \
            "https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz"
          echo "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  $RUNNER_TEMP/age.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/age/age" --version)" = "v1.3.1"
      - name: Encrypt and decrypt-test pre-migration backup
        run: |
          set -euo pipefail
          plaintext_sha256="$(sha256sum "$RUNNER_TEMP/pre-migration.dump" | cut -d' ' -f1)"
          "$RUNNER_TEMP/age/age" --recipient "$MIGRATION_BACKUP_AGE_RECIPIENT" \
            --output "$RUNNER_TEMP/pre-migration.dump.age" "$RUNNER_TEMP/pre-migration.dump"
          printf '%s\n' "$MIGRATION_BACKUP_AGE_IDENTITY" > "$RUNNER_TEMP/age-identity.txt"
          "$RUNNER_TEMP/age/age" --decrypt --identity "$RUNNER_TEMP/age-identity.txt" \
            "$RUNNER_TEMP/pre-migration.dump.age" |
            sha256sum --check <(printf '%s  -\n' "$plaintext_sha256")
          ciphertext_sha256="$(sha256sum "$RUNNER_TEMP/pre-migration.dump.age" | cut -d' ' -f1)"
          printf '{"schema_version":1,"cipher":"age-v1.3.1","plaintext_sha256":"%s","ciphertext_sha256":"%s","decrypt_tested":true}\n' \
            "$plaintext_sha256" "$ciphertext_sha256" > "$RUNNER_TEMP/backup-metadata.json"
          rm -f "$RUNNER_TEMP/pre-migration.dump"
          rm -f "$RUNNER_TEMP/age-identity.txt"
        env:
          MIGRATION_BACKUP_AGE_RECIPIENT: ${{ vars.MIGRATION_BACKUP_AGE_RECIPIENT }}
          MIGRATION_BACKUP_AGE_IDENTITY: ${{ secrets.MIGRATION_BACKUP_AGE_IDENTITY }}
      - name: Upload encrypted recovery artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migrate-backup-${{ inputs.dispatch_nonce }}-attempt-${{ inputs.attempt }}
          path: |
            ${{ runner.temp }}/pre-migration.dump.age
            ${{ runner.temp }}/backup-metadata.json
          if-no-files-found: error
          retention-days: 1
      - name: Apply exact reviewed migration
        id: migration
        run: |
          set -euo pipefail
          TARGET_REVISION="$REVISION"
          if [ "$OPERATION" = "upgrade" ]; then
            uv run --package monitor-api alembic -c apps/api/alembic.ini upgrade "$TARGET_REVISION"
          else
            uv run --package monitor-api alembic -c apps/api/alembic.ini downgrade "$TARGET_REVISION"
          fi
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_REVIEW_ROOT_B64: ${{ inputs.review_root_b64 }}
          MIGRATION_REVIEW_ROOT_SHA256: ${{ inputs.review_root_sha256 }}
          MIGRATION_NO_SPEND_RECEIPT_B64: ${{ inputs.no_spend_receipt_b64 }}
          MIGRATION_NO_SPEND_RECEIPT_SHA256: ${{ inputs.no_spend_receipt_sha256 }}
          MIGRATION_CORRECTION_REVIEW_ROOT_B64: ${{ inputs.review_root_b64 }}
          MIGRATION_CORRECTION_REVIEW_ROOT_SHA256: ${{ inputs.review_root_sha256 }}
          MIGRATION_CORRECTION_NO_SPEND_RECEIPT_B64: ${{ inputs.no_spend_receipt_b64 }}
          MIGRATION_CORRECTION_NO_SPEND_RECEIPT_SHA256: ${{ inputs.no_spend_receipt_sha256 }}
          MIGRATION_CORRECTION_EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          MIGRATION_CORRECTION_EXPECTED_PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
          MIGRATION_CORRECTION_ACTIVATION_NONCE: ${{ inputs.activation_nonce }}
          MIGRATION_CORRECTION_DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          MIGRATION_CORRECTION_ATTEMPT: ${{ inputs.attempt }}
          MIGRATION_REBIND_REVIEW_ROOT_B64: ${{ inputs.review_root_b64 }}
          MIGRATION_REBIND_REVIEW_ROOT_SHA256: ${{ inputs.review_root_sha256 }}
          MIGRATION_REBIND_NO_SPEND_RECEIPT_B64: ${{ inputs.no_spend_receipt_b64 }}
          MIGRATION_REBIND_NO_SPEND_RECEIPT_SHA256: ${{ inputs.no_spend_receipt_sha256 }}
          MIGRATION_REBIND_EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          MIGRATION_REBIND_EXPECTED_PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
          MIGRATION_REBIND_ACTIVATION_NONCE: ${{ inputs.activation_nonce }}
          MIGRATION_REBIND_DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          MIGRATION_REBIND_ATTEMPT: ${{ inputs.attempt }}
          MIGRATION_DISPATCH_REBIND_REVIEW_ROOT_B64: ${{ inputs.review_root_b64 }}
          MIGRATION_DISPATCH_REBIND_REVIEW_ROOT_SHA256: ${{ inputs.review_root_sha256 }}
          MIGRATION_DISPATCH_REBIND_NO_SPEND_RECEIPT_B64: ${{ inputs.no_spend_receipt_b64 }}
          MIGRATION_DISPATCH_REBIND_NO_SPEND_RECEIPT_SHA256: ${{ inputs.no_spend_receipt_sha256 }}
          MIGRATION_DISPATCH_REBIND_EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          MIGRATION_DISPATCH_REBIND_EXPECTED_PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
          MIGRATION_DISPATCH_REBIND_ACTIVATION_NONCE: ${{ inputs.activation_nonce }}
          MIGRATION_DISPATCH_REBIND_DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          MIGRATION_DISPATCH_REBIND_ATTEMPT: ${{ inputs.attempt }}
          MIGRATION_DEPLOY_REBIND_REVIEW_ROOT_B64: ${{ inputs.review_root_b64 }}
          MIGRATION_DEPLOY_REBIND_REVIEW_ROOT_SHA256: ${{ inputs.review_root_sha256 }}
          MIGRATION_DEPLOY_REBIND_NO_SPEND_RECEIPT_B64: ${{ inputs.no_spend_receipt_b64 }}
          MIGRATION_DEPLOY_REBIND_NO_SPEND_RECEIPT_SHA256: ${{ inputs.no_spend_receipt_sha256 }}
          MIGRATION_DEPLOY_REBIND_EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          MIGRATION_DEPLOY_REBIND_EXPECTED_PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
          MIGRATION_DEPLOY_REBIND_ACTIVATION_NONCE: ${{ inputs.activation_nonce }}
          MIGRATION_DEPLOY_REBIND_DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          MIGRATION_DEPLOY_REBIND_ATTEMPT: ${{ inputs.attempt }}
          MIGRATION_OIDC_REBIND_REVIEW_ROOT_B64: ${{ inputs.review_root_b64 }}
          MIGRATION_OIDC_REBIND_REVIEW_ROOT_SHA256: ${{ inputs.review_root_sha256 }}
          MIGRATION_OIDC_REBIND_NO_SPEND_RECEIPT_B64: ${{ inputs.no_spend_receipt_b64 }}
          MIGRATION_OIDC_REBIND_NO_SPEND_RECEIPT_SHA256: ${{ inputs.no_spend_receipt_sha256 }}
          MIGRATION_OIDC_REBIND_EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          MIGRATION_OIDC_REBIND_EXPECTED_PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
          MIGRATION_OIDC_REBIND_ACTIVATION_NONCE: ${{ inputs.activation_nonce }}
          MIGRATION_OIDC_REBIND_DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          MIGRATION_OIDC_REBIND_ATTEMPT: ${{ inputs.attempt }}
          MIGRATION_ACTIVATION_REBIND_REVIEW_ROOT_B64: ${{ inputs.review_root_b64 }}
          MIGRATION_ACTIVATION_REBIND_REVIEW_ROOT_SHA256: ${{ inputs.review_root_sha256 }}
          MIGRATION_ACTIVATION_REBIND_NO_SPEND_RECEIPT_B64: ${{ inputs.no_spend_receipt_b64 }}
          MIGRATION_ACTIVATION_REBIND_NO_SPEND_RECEIPT_SHA256: ${{ inputs.no_spend_receipt_sha256 }}
          MIGRATION_ACTIVATION_REBIND_EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          MIGRATION_ACTIVATION_REBIND_EXPECTED_PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
          MIGRATION_ACTIVATION_REBIND_ACTIVATION_NONCE: ${{ inputs.activation_nonce }}
          MIGRATION_ACTIVATION_REBIND_DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          MIGRATION_ACTIVATION_REBIND_ATTEMPT: ${{ inputs.attempt }}
          MIGRATION_FAILED_ATTEMPT_RECEIPT_B64: ${{ inputs.attempt1_failed_receipt_b64 }}
          MIGRATION_EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          MIGRATION_EXPECTED_PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
          MIGRATION_ACTIVATION_NONCE: ${{ inputs.activation_nonce }}
          MIGRATION_DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          MIGRATION_ATTEMPT: ${{ inputs.attempt }}
          MIGRATION_ATTESTATION_RUN_ID: ${{ inputs.attestation_run_id }}
          MIGRATION_ATTESTATION_PATH: ${{ runner.temp }}/attestation/activation-attestation-generation-${{ inputs.attestation_generation }}.json
          MIGRATION_ACTIVATION_ATTESTATION_PATH: ${{ runner.temp }}/attestation/activation-attestation-generation-${{ inputs.attestation_generation }}.json
          MIGRATION_ACTIVATION_EVIDENCE_RECEIPT_PATH: ${{ runner.temp }}/attestation/activation-evidence-public-receipt.json
          MIGRATION_ATTESTATION_SHA256: ${{ inputs.attestation_sha256 }}
      - name: Verify exact resulting revision
        run: |
          set -euo pipefail
          uv run --package monitor-api alembic -c apps/api/alembic.ini current > "$RUNNER_TEMP/alembic-result.txt"
          RESULT_FILE="$RUNNER_TEMP/alembic-result.txt" uv run --package monitor-api python -m scripts.migration_dispatch_validator validate-result
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      - name: Export canonical correction receipt
        if: ${{ inputs.operation == 'upgrade' && (inputs.revision == '20260803_0010a' || inputs.revision == '20260803_0010b' || inputs.revision == '20260803_0010c' || inputs.revision == '20260803_0010d' || inputs.revision == '20260803_0010e' || inputs.revision == '20260803_0010f') }}
        shell: bash
        run: |
          set -euo pipefail
          case "$REVISION" in
            20260803_0010a) correction_command="release-correction-0010a" ;;
            20260803_0010b) correction_command="release-correction-0010b" ;;
            20260803_0010c) correction_command="release-correction-0010c" ;;
            20260803_0010d) correction_command="release-correction-0010d" ;;
            20260803_0010e) correction_command="release-correction-0010e" ;;
            20260803_0010f) correction_command="release-correction-0010f" ;;
            *) exit 2 ;;
          esac
          printf '%s\n' "SELECT convert_from(canonical_receipt, 'UTF8') FROM release_receipt_chain WHERE command = :'correction_command' AND dispatch_nonce = :'dispatch_nonce'::uuid;" \
            | psql "$PG_DUMP_DATABASE_URL" --no-psqlrc --tuples-only --no-align \
            --set=correction_command="$correction_command" \
            --set=dispatch_nonce="$DISPATCH_NONCE" \
            | tr -d '\r\n' > "$RUNNER_TEMP/operation.json"
          jq -e \
            --arg reviewed_sha "$EXPECTED_COMMIT_SHA" \
            --arg dispatch_nonce "$DISPATCH_NONCE" \
            --arg correction_command "$correction_command" \
            '.command == $correction_command and .reviewed_sha == $reviewed_sha and .dispatch_nonce == $dispatch_nonce and .accepted == true and .terminal_for_attempt == true' \
            "$RUNNER_TEMP/operation.json" > /dev/null
        env:
          PG_DUMP_DATABASE_URL: ${{ secrets.PG_DUMP_DATABASE_URL }}
      - name: Upload terminal correction receipt
        if: ${{ inputs.operation == 'upgrade' && (inputs.revision == '20260803_0010a' || inputs.revision == '20260803_0010b' || inputs.revision == '20260803_0010c' || inputs.revision == '20260803_0010d' || inputs.revision == '20260803_0010e' || inputs.revision == '20260803_0010f') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migrate-repair-${{ inputs.revision }}-${{ inputs.dispatch_nonce }}-attempt-${{ inputs.attempt }}
          path: ${{ runner.temp }}/operation.json
          retention-days: 1
          if-no-files-found: error
      - name: Complete durable migration operation
        if: ${{ inputs.reservation_sha256 != '' }}
        run: |
          uv run --package monitor-api python apps/api/scripts/workflow_operation_complete.py \
            --api-url "${{ vars.MONITOR_API_URL }}" \
            --command "${{ inputs.operation == 'upgrade' && 'migrate-0011' || 'migrate-0011-to-0010f' }}" \
            --display-title "migrate-${{ inputs.operation }}-${{ inputs.revision }}-${{ inputs.dispatch_nonce }}-attempt-${{ inputs.attempt }}" \
            --evidence "$RUNNER_TEMP/alembic-result.txt" \
            --expected-plan-sha256 "${{ inputs.expected_plan_sha256 }}" \
            --head-sha "${{ inputs.expected_commit_sha }}" \
            --activation-nonce "${{ inputs.activation_nonce }}" \
            --dispatch-nonce "${{ inputs.dispatch_nonce }}" \
            --reservation-sha256 "${{ inputs.reservation_sha256 }}" \
            --workflow migrate.yml \
            --environment production-migration \
            --attempt "${{ inputs.attempt }}" \
            --json-out "$RUNNER_TEMP/operation.json"
      - name: Upload terminal migration operation receipt
        if: ${{ inputs.reservation_sha256 != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migrate-${{ inputs.operation == 'upgrade' && '0011' || 'downgrade-0010f' }}-${{ inputs.dispatch_nonce }}-attempt-${{ inputs.attempt }}
          path: |
            ${{ runner.temp }}/operation.json
            ${{ runner.temp }}/workflow-claim-public-receipt.json
          retention-days: 1
          if-no-files-found: error
      - name: Verify failed operation remained at the safe revision
        if: ${{ steps.migration.outcome == 'failure' }}
        run: |
          set -euo pipefail
          uv run --package monitor-api alembic -c apps/api/alembic.ini current > "$RUNNER_TEMP/alembic-failed-current.txt"
          CURRENT_FILE="$RUNNER_TEMP/alembic-failed-current.txt" uv run --package monitor-api python -m scripts.migration_dispatch_validator validate-current
          echo "Migration failed without automatic restore; incident HOLD is required." >&2
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      - name: Emit canonical bootstrap failed-attempt receipt
        if: ${{ steps.migration.outcome == 'failure' && inputs.operation == 'upgrade' && inputs.revision == '20260727_0010' }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_sha256="$(sha256sum "$RUNNER_TEMP/pre-migration.dump.age" | cut -d' ' -f1)"
          enum_residue_raw="$(psql "$PG_DUMP_DATABASE_URL" --no-psqlrc --tuples-only --no-align \
            --command="SELECT EXISTS (SELECT 1 FROM pg_enum e JOIN pg_type t ON t.oid=e.enumtypid WHERE t.typname='source_platform' AND e.enumlabel='manifold')")"
          enum_residue=false
          if [ "$enum_residue_raw" = "t" ]; then enum_residue=true; fi
          ledger_exists_raw="$(psql "$PG_DUMP_DATABASE_URL" --no-psqlrc --tuples-only --no-align \
            --command="SELECT to_regclass('public.release_roots') IS NOT NULL")"
          ledger_exists=false
          if [ "$ledger_exists_raw" = "t" ]; then ledger_exists=true; fi
          manifold_data_raw="$(psql "$PG_DUMP_DATABASE_URL" --no-psqlrc --tuples-only --no-align \
            --command="SELECT EXISTS (SELECT 1 FROM community_sources WHERE platform::text='manifold')")"
          manifold_data_exists=false
          if [ "$manifold_data_raw" = "t" ]; then manifold_data_exists=true; fi
          test "$ledger_exists" = "false"
          test "$manifold_data_exists" = "false"
          jq -cS -n \
            --arg reviewed_sha "$EXPECTED_COMMIT_SHA" \
            --arg plan_sha "$EXPECTED_PLAN_SHA256" \
            --arg activation_nonce "$ACTIVATION_NONCE" \
            --arg dispatch_nonce "$DISPATCH_NONCE" \
            --arg root_sha "$REVIEW_ROOT_SHA256" \
            --arg no_spend_sha "$NO_SPEND_RECEIPT_SHA256" \
            --arg artifact_sha "$artifact_sha256" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson enum_residue "$enum_residue" \
            --argjson ledger_exists "$ledger_exists" \
            --argjson manifold_data_exists "$manifold_data_exists" \
            '{accepted:false,activation_nonce:$activation_nonce,approved_plan_sha256:$plan_sha,artifact_sha256:$artifact_sha,attempt:1,command:"migrate-0010-bootstrap",dispatch_nonce:$dispatch_nonce,enum_residue:$enum_residue,ledger_exists:$ledger_exists,manifold_data_exists:$manifold_data_exists,no_spend_receipt_sha256:$no_spend_sha,retry_permitted:true,review_root_sha256:$root_sha,reviewed_sha:$reviewed_sha,run_id:$run_id,schema_version:1,state_after:"20260726_0009",state_before:"20260726_0009",terminal_for_attempt:true}' \
            > "$RUNNER_TEMP/failed-attempt-receipt.json"
        env:
          PG_DUMP_DATABASE_URL: ${{ secrets.PG_DUMP_DATABASE_URL }}
      - name: Upload canonical bootstrap failed-attempt receipt
        if: ${{ steps.migration.outcome == 'failure' && inputs.operation == 'upgrade' && inputs.revision == '20260727_0010' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migrate-0010-bootstrap-${{ inputs.dispatch_nonce }}-attempt-${{ inputs.attempt }}
          path: ${{ runner.temp }}/failed-attempt-receipt.json
          if-no-files-found: error
          retention-days: 1
