name: ci
run-name: ci-${{ inputs.dispatch_nonce }}-attempt-${{ inputs.attempt }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full reviewed protected-main commit SHA
        required: true
        type: string
      expected_plan_sha256:
        description: Approved plan SHA-256
        required: true
        type: string
      activation_nonce:
        description: Root activation UUID
        required: true
        type: string
      dispatch_nonce:
        description: Fresh workflow dispatch UUID
        required: true
        type: string
      reservation_sha256:
        description: Durable reservation receipt SHA-256
        required: true
        type: string
      attempt:
        description: Immutable attempt number (1 or 2)
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && inputs.dispatch_nonce || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
          persist-credentials: false

      - name: Validate immutable workflow identity
        shell: bash
        env:
          ACTIVATION_NONCE: ${{ inputs.activation_nonce }}
          ATTEMPT: ${{ inputs.attempt }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          EXPECTED_PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GITHUB_EVENT_SHA: ${{ github.sha }}
          RESERVATION_SHA256: ${{ inputs.reservation_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_EVENT_SHA"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            exit 0
          fi
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RESERVATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ACTIVATION_NONCE" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ "$DISPATCH_NONCE" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          test "$ACTIVATION_NONCE" != "$DISPATCH_NONCE"
          [ "$ATTEMPT" = "1" ] || [ "$ATTEMPT" = "2" ]

      - name: Claim durable workflow reservation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          ACTIVATION_NONCE: ${{ inputs.activation_nonce }}
          APPROVED_PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
          ATTEMPT: ${{ inputs.attempt }}
          CLAIM_ENVIRONMENT: "null"
          DISPLAY_TITLE: ci-${{ inputs.dispatch_nonce }}-attempt-${{ inputs.attempt }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          HEAD_SHA: ${{ inputs.expected_sha }}
          MONITOR_API_URL: ${{ vars.MONITOR_API_URL }}
          RESERVATION_SHA256: ${{ inputs.reservation_sha256 }}
          WORKFLOW_FILE: ci.yml
        run: |
          set -euo pipefail
          umask 077
          token_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=monitor-control")"
          oidc_token="$(jq -er '.value' <<<"$token_response")"
          jq -cn \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$WORKFLOW_FILE" \
            --arg display_title "$DISPLAY_TITLE" \
            --arg head_sha "$HEAD_SHA" \
            --arg approved_plan_sha256 "$APPROVED_PLAN_SHA256" \
            --arg activation_nonce "$ACTIVATION_NONCE" \
            --arg dispatch_nonce "$DISPATCH_NONCE" \
            --arg reservation_sha256 "$RESERVATION_SHA256" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg ref "$GITHUB_REF" \
            --argjson environment "$CLAIM_ENVIRONMENT" \
            '{repository:$repository,workflow:$workflow,display_title:$display_title,head_sha:$head_sha,approved_plan_sha256:$approved_plan_sha256,activation_nonce:$activation_nonce,dispatch_nonce:$dispatch_nonce,reservation_sha256:$reservation_sha256,run_id:$run_id,run_attempt:$run_attempt,event:$event,ref:$ref,environment:$environment}' \
            > "$RUNNER_TEMP/workflow-claim-request.json"
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/workflow-claim-request.json" \
            "${MONITOR_API_URL}/internal/release/workflow-dispatch-claim" \
            > "$RUNNER_TEMP/workflow-claim-public-receipt.json"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$WORKFLOW_FILE" \
            --arg display_title "$DISPLAY_TITLE" \
            --arg head_sha "$HEAD_SHA" \
            --arg approved_plan_sha256 "$APPROVED_PLAN_SHA256" \
            --arg activation_nonce "$ACTIVATION_NONCE" \
            --arg dispatch_nonce "$DISPATCH_NONCE" \
            --arg reservation_sha256 "$RESERVATION_SHA256" \
            --argjson attempt "$ATTEMPT" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg ref "$GITHUB_REF" \
            --argjson environment "$CLAIM_ENVIRONMENT" \
            '
              def sha256: type == "string" and test("^[0-9a-f]{64}$");
              def timestamp: type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[^[:space:]]+(Z|[+-][0-9]{2}:[0-9]{2})$");
              (keys | sort) == ([
                "schema","command","reviewed_sha","approved_plan_sha256",
                "approval_round_id","approval_launch_sha256s",
                "activation_nonce","dispatch_nonce","attempt",
                "database_timestamps","accepted","terminal_for_attempt",
                "retry_permitted","predecessor_receipt_sha256","receipt_sha256",
                "repository","workflow","display_title","head_sha",
                "reservation_sha256","run_id","run_attempt","event","ref",
                "environment"
              ] | sort)
              and .schema == "release-chain-receipt.v1"
              and .command == "workflow-dispatch-claim"
              and .reviewed_sha == $head_sha
              and .approved_plan_sha256 == $approved_plan_sha256
              and (.approval_round_id | type == "string" and length > 0)
              and (.approval_launch_sha256s | type == "array" and length == 2 and all(.[]; sha256) and (unique | length == 2))
              and .activation_nonce == $activation_nonce
              and .dispatch_nonce == $dispatch_nonce
              and .attempt == $attempt
              and (.database_timestamps | (keys | sort) == ["claimed_at_db","created_at_db","reserved_at_db","selection_floor_at"] and all(.[]; timestamp) and .created_at_db == .claimed_at_db)
              and .accepted == true
              and .terminal_for_attempt == false
              and .retry_permitted == false
              and .predecessor_receipt_sha256 == $reservation_sha256
              and (.receipt_sha256 | sha256)
              and .repository == $repository
              and .workflow == $workflow
              and .display_title == $display_title
              and .head_sha == $head_sha
              and .reservation_sha256 == $reservation_sha256
              and .run_id == $run_id
              and .run_attempt == $run_attempt
              and .event == $event
              and .ref == $ref
              and .environment == $environment
            ' \
            "$RUNNER_TEMP/workflow-claim-public-receipt.json" > /dev/null
          rm -f "$RUNNER_TEMP/workflow-claim-request.json"

      - name: Upload redacted workflow receipt
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-${{ inputs.dispatch_nonce }}-attempt-${{ inputs.attempt }}
          path: ${{ runner.temp }}/workflow-claim-public-receipt.json
          retention-days: 1
          if-no-files-found: error

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0

      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.5.30"
          enable-cache: true

      - name: Enable pinned pnpm
        run: corepack enable pnpm && corepack prepare pnpm@9.15.4 --activate

      - name: Install Python dependencies
        run: uv sync --frozen --all-packages

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API tests
        run: uv run --package monitor-api pytest apps/api/tests/contracts apps/api/tests/unit -q

      - name: Run URL-gated RP-07 PostgreSQL retention proof
        run: uv run --package monitor-api pytest apps/api/tests/integration/test_postgres_report_retention.py -q -rs

      - name: Check API lint
        run: uv run --all-packages ruff check apps/api/app apps/api/scripts apps/api/tests workers/codex-worker/src workers/codex-worker/tests

      - name: Check API types
        run: uv run --all-packages basedpyright apps/api/app apps/api/scripts apps/api/tests workers/codex-worker/src workers/codex-worker/tests

      - name: Run web tests
        run: pnpm --filter @prediction-market/web test

      - name: Check generated API contract drift
        run: pnpm --filter @prediction-market/web check:api

      - name: Check web types
        run: pnpm --filter @prediction-market/web typecheck

      - name: Check web lint
        run: pnpm --filter @prediction-market/web lint

      - name: Build web
        run: pnpm --filter @prediction-market/web build

  deploy-preview:
    if: ${{ github.ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview-deploy
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            project_secret: VERCEL_API_PROJECT_ID
          - app: web
            project_secret: VERCEL_WEB_PROJECT_ID
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0

      - name: Enable pinned pnpm
        run: corepack enable pnpm && corepack prepare pnpm@9.15.4 --activate

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@51.7.0

      - name: Pull Vercel preview environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}

      - name: Build Vercel preview artifact
        if: ${{ matrix.app == 'web' }}
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}

      - name: Test after Vercel build
        if: ${{ matrix.app == 'web' }}
        run: test -d .vercel/output

      - name: Deploy Vercel API preview from source
        if: ${{ matrix.app == 'api' }}
        run: vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}

      - name: Deploy Vercel preview prebuilt artifact
        if: ${{ matrix.app == 'web' }}
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}

  deploy-production:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-deploy
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            project_secret: VERCEL_API_PROJECT_ID
          - app: web
            project_secret: VERCEL_WEB_PROJECT_ID
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0

      - name: Enable pinned pnpm
        run: corepack enable pnpm && corepack prepare pnpm@9.15.4 --activate

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@51.7.0

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}

      - name: Build Vercel production artifact
        if: ${{ matrix.app == 'web' }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}

      - name: Test after Vercel build
        if: ${{ matrix.app == 'web' }}
        run: test -d .vercel/output

      - name: Deploy Vercel API production from source
        if: ${{ matrix.app == 'api' }}
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}

      - name: Deploy Vercel production prebuilt artifact
        if: ${{ matrix.app == 'web' }}
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}
