name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0

      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.5.30"
          enable-cache: true

      - name: Enable pinned pnpm
        run: corepack prepare pnpm@9.15.4 --activate

      - name: Install Python dependencies
        run: uv sync --frozen --all-packages

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API tests
        run: uv run --package monitor-api pytest apps/api/tests/contracts apps/api/tests/unit -q

      - name: Run URL-gated RP-07 PostgreSQL retention proof
        run: uv run --package monitor-api pytest apps/api/tests/integration/test_postgres_report_retention.py -q -rs

      - name: Check API lint
        run: uv run --all-packages ruff check apps/api/app apps/api/tests workers/codex-worker/src workers/codex-worker/tests

      - name: Check API types
        run: uv run --all-packages basedpyright apps/api/app apps/api/tests workers/codex-worker/src workers/codex-worker/tests

      - name: Run web tests
        run: pnpm --filter @prediction-market/web test

      - name: Check generated API contract drift
        run: pnpm --filter @prediction-market/web check:api

      - name: Check web types
        run: pnpm --filter @prediction-market/web typecheck

      - name: Check web lint
        run: pnpm --filter @prediction-market/web lint

      - name: Build web
        run: pnpm --filter @prediction-market/web build

  deploy-preview:
    if: ${{ github.ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview-deploy
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            project_secret: VERCEL_API_PROJECT_ID
          - app: web
            project_secret: VERCEL_WEB_PROJECT_ID
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0

      - name: Enable pinned pnpm
        run: corepack prepare pnpm@9.15.4 --activate

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@51.7.0

      - name: Pull Vercel preview environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}

      - name: Build Vercel preview artifact
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}

      - name: Test after Vercel build
        run: test -d .vercel/output

      - name: Deploy Vercel preview prebuilt artifact
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}

  deploy-production:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-deploy
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            project_secret: VERCEL_API_PROJECT_ID
          - app: web
            project_secret: VERCEL_WEB_PROJECT_ID
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0

      - name: Enable pinned pnpm
        run: corepack prepare pnpm@9.15.4 --activate

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@51.7.0

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}

      - name: Build Vercel production artifact
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}

      - name: Test after Vercel build
        run: test -d .vercel/output

      - name: Deploy Vercel production prebuilt artifact
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}
