name: collect
run-name: collect-${{ inputs.mode }}-${{ inputs.dispatch_nonce }}-attempt-${{ inputs.attempt }}

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Exact reviewed collector execution mode
        required: true
        type: string
      command_id:
        description: Existing durable command UUID for a manual dispatch
        required: false
        type: string
      expected_sha:
        description: Full reviewed protected-main commit SHA
        required: true
        type: string
      expected_plan_sha256:
        description: Approved plan SHA-256
        required: true
        type: string
      activation_nonce:
        description: Root activation UUID
        required: true
        type: string
      dispatch_nonce:
        description: Fresh workflow dispatch UUID
        required: true
        type: string
      reservation_sha256:
        description: Durable reservation receipt SHA-256
        required: true
        type: string
      attempt:
        description: Immutable attempt number (1 or 2)
        required: true
        type: number
      cadence_slot_key:
        description: Original UTC slot key for an explicit cadence retry
        required: false
        type: string
      failed_cadence_attempt_id:
        description: Failed attempt-1 UUID authorizing an explicit cadence retry
        required: false
        type: string
      smoke_activation_at:
        description: UTC activation timestamp used only by direct-smoke
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: collector-control-plane
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: production-collector
    env:
      PYTHONPATH: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
          persist-credentials: false
      - name: Validate immutable workflow identity
        shell: bash
        env:
          ACTIVATION_NONCE: ${{ inputs.activation_nonce }}
          ATTEMPT: ${{ inputs.attempt }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          EXPECTED_PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GITHUB_EVENT_SHA: ${{ github.sha }}
          RESERVATION_SHA256: ${{ inputs.reservation_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_EVENT_SHA"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            exit 0
          fi
          test "$GITHUB_EVENT_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RESERVATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ACTIVATION_NONCE" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ "$DISPATCH_NONCE" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          test "$ACTIVATION_NONCE" != "$DISPATCH_NONCE"
          [ "$ATTEMPT" = "1" ] || [ "$ATTEMPT" = "2" ]
      - name: Claim durable workflow reservation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'direct-smoke' }}
        shell: bash
        env:
          ACTIVATION_NONCE: ${{ inputs.activation_nonce }}
          APPROVED_PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
          ATTEMPT: ${{ inputs.attempt }}
          CLAIM_ENVIRONMENT: '"production-collector"'
          DISPLAY_TITLE: collect-${{ inputs.mode }}-${{ inputs.dispatch_nonce }}-attempt-${{ inputs.attempt }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          HEAD_SHA: ${{ inputs.expected_sha }}
          MONITOR_API_URL: ${{ vars.MONITOR_API_URL }}
          RESERVATION_SHA256: ${{ inputs.reservation_sha256 }}
          WORKFLOW_FILE: collect.yml
        run: |
          set -euo pipefail
          umask 077
          token_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=monitor-control")"
          oidc_token="$(jq -er '.value' <<<"$token_response")"
          jq -cn \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$WORKFLOW_FILE" \
            --arg display_title "$DISPLAY_TITLE" \
            --arg head_sha "$HEAD_SHA" \
            --arg approved_plan_sha256 "$APPROVED_PLAN_SHA256" \
            --arg activation_nonce "$ACTIVATION_NONCE" \
            --arg dispatch_nonce "$DISPATCH_NONCE" \
            --arg reservation_sha256 "$RESERVATION_SHA256" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg ref "$GITHUB_REF" \
            --argjson environment "$CLAIM_ENVIRONMENT" \
            '{repository:$repository,workflow:$workflow,display_title:$display_title,head_sha:$head_sha,approved_plan_sha256:$approved_plan_sha256,activation_nonce:$activation_nonce,dispatch_nonce:$dispatch_nonce,reservation_sha256:$reservation_sha256,run_id:$run_id,run_attempt:$run_attempt,event:$event,ref:$ref,environment:$environment}' \
            > "$RUNNER_TEMP/workflow-claim-request.json"
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/workflow-claim-request.json" \
            "${MONITOR_API_URL}/internal/release/workflow-dispatch-claim" \
            > "$RUNNER_TEMP/workflow-claim-public-receipt.json"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$WORKFLOW_FILE" \
            --arg display_title "$DISPLAY_TITLE" \
            --arg head_sha "$HEAD_SHA" \
            --arg approved_plan_sha256 "$APPROVED_PLAN_SHA256" \
            --arg activation_nonce "$ACTIVATION_NONCE" \
            --arg dispatch_nonce "$DISPATCH_NONCE" \
            --arg reservation_sha256 "$RESERVATION_SHA256" \
            --argjson attempt "$ATTEMPT" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg ref "$GITHUB_REF" \
            --argjson environment "$CLAIM_ENVIRONMENT" \
            '
              def sha256: type == "string" and test("^[0-9a-f]{64}$");
              def timestamp: type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[^[:space:]]+(Z|[+-][0-9]{2}:[0-9]{2})$");
              (keys | sort) == ([
                "schema","command","reviewed_sha","approved_plan_sha256",
                "approval_round_id","approval_launch_sha256s",
                "activation_nonce","dispatch_nonce","attempt",
                "database_timestamps","accepted","terminal_for_attempt",
                "retry_permitted","predecessor_receipt_sha256","receipt_sha256",
                "repository","workflow","display_title","head_sha",
                "reservation_sha256","run_id","run_attempt","event","ref",
                "environment"
              ] | sort)
              and .schema == "release-chain-receipt.v1"
              and .command == "workflow-dispatch-claim"
              and .reviewed_sha == $head_sha
              and .approved_plan_sha256 == $approved_plan_sha256
              and (.approval_round_id | type == "string" and length > 0)
              and (.approval_launch_sha256s | type == "array" and length == 2 and all(.[]; sha256) and (unique | length == 2))
              and .activation_nonce == $activation_nonce
              and .dispatch_nonce == $dispatch_nonce
              and .attempt == $attempt
              and (.database_timestamps | (keys | sort) == ["claimed_at_db","created_at_db","reserved_at_db","selection_floor_at"] and all(.[]; timestamp) and .created_at_db == .claimed_at_db)
              and .accepted == true
              and .terminal_for_attempt == false
              and .retry_permitted == false
              and .predecessor_receipt_sha256 == $reservation_sha256
              and (.receipt_sha256 | sha256)
              and .repository == $repository
              and .workflow == $workflow
              and .display_title == $display_title
              and .head_sha == $head_sha
              and .reservation_sha256 == $reservation_sha256
              and .run_id == $run_id
              and .run_attempt == $run_attempt
              and .event == $event
              and .ref == $ref
              and .environment == $environment
            ' \
            "$RUNNER_TEMP/workflow-claim-public-receipt.json" > /dev/null
          rm -f "$RUNNER_TEMP/workflow-claim-request.json"
      - name: Upload redacted workflow receipt
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'direct-smoke' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: collect-claim-${{ inputs.mode }}-${{ inputs.dispatch_nonce }}-attempt-${{ inputs.attempt }}
          path: ${{ runner.temp }}/workflow-claim-public-receipt.json
          retention-days: 1
          if-no-files-found: error
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.5.30"
          enable-cache: true
      - run: uv sync --package monitor-api --locked
      - name: Create zero-provider binding evidence
        if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON('["binding-prestate","binding-handshake","binding-restore-verify"]'), inputs.mode) }}
        shell: bash
        env:
          MONITOR_SOURCE_BINDINGS_JSON: ${{ secrets.MONITOR_SOURCE_BINDINGS_JSON }}
          MONITOR_SCOPE_VERSION: ${{ vars.MONITOR_SCOPE_VERSION }}
          MONITOR_SOURCE_IDS: ${{ vars.MONITOR_SOURCE_IDS }}
        run: |
          set -euo pipefail
          uv run --package monitor-api python apps/api/scripts/zero_provider_binding_evidence.py \
            --mode "${{ inputs.mode }}" \
            --activation-nonce "${{ inputs.activation_nonce }}" \
            --source-ids "$MONITOR_SOURCE_IDS" \
            --scope-version "$MONITOR_SCOPE_VERSION" \
            --bindings-json-env MONITOR_SOURCE_BINDINGS_JSON \
            --json-out "$RUNNER_TEMP/cadence-operation-result.json"
      - name: Resolve exact cadence branch
        if: ${{ github.event_name == 'schedule' || !contains(fromJSON('["binding-prestate","binding-handshake","binding-restore-verify"]'), inputs.mode) }}
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SLOT_KEY: ${{ inputs.cadence_slot_key }}
          INPUT_FAILED_ATTEMPT: ${{ inputs.failed_cadence_attempt_id }}
          INPUT_ATTEMPT: ${{ inputs.attempt }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            slot_key="$(uv run --package monitor-api python apps/api/scripts/release_cadence_workflow_client.py slot --kind collection)"
            mode="schedule"
            cadence_attempt="1"
            failed_attempt="none"
          elif [ "$INPUT_MODE" = "cadence-retry" ]; then
            test "$INPUT_ATTEMPT" = "2"
            [[ "$INPUT_SLOT_KEY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:00Z$ ]]
            [[ "$INPUT_FAILED_ATTEMPT" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
            slot_key="$INPUT_SLOT_KEY"
            mode="retry"
            cadence_attempt="2"
            failed_attempt="$INPUT_FAILED_ATTEMPT"
          else
            slot_key="$(uv run --package monitor-api python apps/api/scripts/release_cadence_workflow_client.py slot --kind collection)"
            mode="manual"
            cadence_attempt="1"
            failed_attempt="none"
          fi
          {
            echo "CADENCE_SLOT_KEY=$slot_key"
            echo "CADENCE_MODE=$mode"
            echo "CADENCE_ATTEMPT=$cadence_attempt"
            echo "CADENCE_FAILED_ATTEMPT=$failed_attempt"
          } >> "$GITHUB_ENV"
      - name: Collect through the scoped API
        if: ${{ github.event_name == 'schedule' || !contains(fromJSON('["binding-prestate","binding-handshake","binding-restore-verify"]'), inputs.mode) }}
        working-directory: apps/api
        run: uv run --package monitor-api python -m app.collection.cli collect
        env:
          MONITOR_API_URL: ${{ vars.MONITOR_API_URL }}
          MONITOR_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'scheduled' }}
          MONITOR_SCOPE_VERSION: ${{ vars.MONITOR_SCOPE_VERSION }}
          MONITOR_DEPLOYMENT_ACTIVATION_AT: ${{ inputs.mode == 'direct-smoke' && inputs.smoke_activation_at || vars.MONITOR_DEPLOYMENT_ACTIVATION_AT }}
          MONITOR_SOURCE_IDS: ${{ vars.MONITOR_SOURCE_IDS }}
          MONITOR_COMMAND_ID: ${{ inputs.command_id }}
          MONITOR_CADENCE_RESULT_PATH: ${{ runner.temp }}/cadence-operation-result.json
          MONITOR_CADENCE_SLOT_KEY: ${{ env.CADENCE_SLOT_KEY }}
          MONITOR_SOURCE_BINDINGS_JSON: ${{ secrets.MONITOR_SOURCE_BINDINGS_JSON }}
          DCINSIDE_USER_AGENT: ${{ vars.DCINSIDE_USER_AGENT }}
          REDDIT_OAUTH_ACCESS_TOKEN: ${{ secrets.REDDIT_OAUTH_ACCESS_TOKEN }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
      - name: Complete durable collection operation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'direct-smoke' }}
        run: |
          uv run --package monitor-api python apps/api/scripts/workflow_operation_complete.py \
            --api-url "${{ vars.MONITOR_API_URL }}" \
            --command "${{ inputs.mode }}" \
            --display-title "collect-${{ inputs.mode }}-${{ inputs.dispatch_nonce }}-attempt-${{ inputs.attempt }}" \
            --evidence "$RUNNER_TEMP/cadence-operation-result.json" \
            --expected-plan-sha256 "${{ inputs.expected_plan_sha256 }}" \
            --head-sha "${{ inputs.expected_sha }}" \
            --activation-nonce "${{ inputs.activation_nonce }}" \
            --dispatch-nonce "${{ inputs.dispatch_nonce }}" \
            --reservation-sha256 "${{ inputs.reservation_sha256 }}" \
            --workflow collect.yml \
            --environment production-collector \
            --attempt "${{ inputs.attempt }}" \
            --json-out "$RUNNER_TEMP/operation.json"
      - name: Upload terminal collection operation receipt
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'direct-smoke' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: collect-${{ inputs.mode }}-${{ inputs.dispatch_nonce }}-attempt-${{ inputs.attempt }}
          path: |
            ${{ runner.temp }}/operation.json
            ${{ runner.temp }}/workflow-claim-public-receipt.json
            ${{ runner.temp }}/cadence-operation-result.json
          retention-days: 1
          if-no-files-found: error
      - name: Record durable cadence attempt
        id: cadence-record
        if: ${{ always() && (github.event_name == 'schedule' || inputs.mode == 'cadence-retry') }}
        shell: bash
        env:
          CADENCE_EPOCH_ID: ${{ vars.CADENCE_EPOCH_ID }}
          MONITOR_API_URL: ${{ vars.MONITOR_API_URL }}
        run: |
          set -euo pipefail
          uv run --package monitor-api python apps/api/scripts/release_cadence_workflow_client.py record \
            --api-url "$MONITOR_API_URL" \
            --epoch-id "$CADENCE_EPOCH_ID" \
            --mode "$CADENCE_MODE" \
            --cadence-attempt "$CADENCE_ATTEMPT" \
            --failed-predecessor-attempt-id "$CADENCE_FAILED_ATTEMPT" \
            --result "$RUNNER_TEMP/cadence-operation-result.json" \
            --json-out "$RUNNER_TEMP/cadence-attempt-receipt.json"
      - name: Upload public cadence receipt
        if: ${{ always() && steps.cadence-record.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cadence-collection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cadence-attempt-receipt.json
          retention-days: 1
          if-no-files-found: error
