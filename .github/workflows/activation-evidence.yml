name: activation-evidence
run-name: activation-evidence-${{ inputs.activation_nonce }}-generation-${{ inputs.attestation_generation }}-${{ inputs.dispatch_nonce }}-attempt-${{ inputs.attempt }}

on:
  workflow_dispatch:
    inputs:
      activation_nonce:
        required: true
        type: string
      attestation_generation:
        required: true
        type: number
      dispatch_nonce:
        required: true
        type: string
      attempt:
        required: true
        type: number
      expected_commit_sha:
        required: true
        type: string
      expected_plan_sha256:
        required: true
        type: string
      reservation_sha256:
        required: true
        type: string
      predecessor_sha256:
        required: true
        type: string
      attestation_sha256:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-collector
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
      - name: Validate protected-main immutable dispatch
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT_SHA"
          test "$GITHUB_REF" = "refs/heads/main"
      - name: Canonicalize schema-closed attestation
        env:
          ACTIVATION_NONCE: ${{ inputs.activation_nonce }}
          ATTESTATION_JSON: ${{ secrets.MANIFOLD_ACTIVATION_ATTESTATION_JSON }}
          ATTESTATION_SHA256: ${{ inputs.attestation_sha256 }}
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          N: ${{ inputs.attestation_generation }}
        run: |
          set -euo pipefail
          umask 077
          canonical="$(printf '%s' "$ATTESTATION_JSON" |
            jq -ceS \
              --arg activation_nonce "$ACTIVATION_NONCE" \
              --arg expected_commit_sha "$EXPECTED_COMMIT_SHA" \
              --argjson attestation_generation "$N" \
              '
                def sha256:
                  type == "string" and test("^[0-9a-f]{64}$");
                def uuid:
                  type == "string" and test("^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$");
                def timestamp:
                  type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[^[:space:]]+(Z|[+-][0-9]{2}:[0-9]{2})$");
                def public_url:
                  type == "string" and test("^https?://[^[:space:]]+$");
                if type == "object"
                  and (keys | sort) == [
                    "activation_nonce",
                    "attestation_generation",
                    "authorization_evidence_sha256",
                    "captured_at",
                    "evidence_database_time",
                    "free_tier_evidence_sha256",
                    "predecessor_attestation_sha256",
                    "provenance_sha256",
                    "public_evidence_urls",
                    "reviewed_sha",
                    "schema_version",
                    "source_scope_version"
                  ]
                  and .schema_version == 1
                  and .reviewed_sha == $expected_commit_sha
                  and .activation_nonce == $activation_nonce
                  and .attestation_generation == $attestation_generation
                  and (.source_scope_version | type == "string" and length >= 1 and length <= 80)
                  and (.authorization_evidence_sha256 | sha256)
                  and (.free_tier_evidence_sha256 | sha256)
                  and (.provenance_sha256 | sha256)
                  and (.predecessor_attestation_sha256 == null or (.predecessor_attestation_sha256 | sha256))
                  and (.activation_nonce | uuid)
                  and (.captured_at | timestamp)
                  and (.evidence_database_time | timestamp)
                  and (.public_evidence_urls | type == "array" and length >= 1 and length <= 20 and all(.[]; public_url))
                then .
                else error("activation attestation schema rejected")
                end
              ')"
          printf '%s' "$canonical" |
            uv run --quiet --package monitor-api \
              python apps/api/scripts/activation_evidence_models.py \
              > "activation-attestation-generation-${N}.json"
          test "$(sha256sum "activation-attestation-generation-${N}.json" | cut -d' ' -f1)" = "$ATTESTATION_SHA256"
      - name: Verify through scoped release API
        env:
          ACTIVATION_NONCE: ${{ inputs.activation_nonce }}
          ATTESTATION_GENERATION: ${{ inputs.attestation_generation }}
          ATTESTATION_SHA256: ${{ inputs.attestation_sha256 }}
          ATTEMPT: ${{ inputs.attempt }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          EXPECTED_PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
          HEAD_SHA: ${{ github.sha }}
          MONITOR_API_URL: ${{ vars.MONITOR_API_URL }}
          PREDECESSOR_SHA256: ${{ inputs.predecessor_sha256 }}
          RESERVATION_SHA256: ${{ inputs.reservation_sha256 }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          token_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=monitor-control")"
          oidc_token="$(jq -er '.value' <<<"$token_response")"
          jq -cn \
            --slurpfile attestation "activation-attestation-generation-${ATTESTATION_GENERATION}.json" \
            --arg activation_nonce "$ACTIVATION_NONCE" \
            --argjson attestation_generation "$ATTESTATION_GENERATION" \
            --arg attestation_sha256 "$ATTESTATION_SHA256" \
            --argjson attempt "$ATTEMPT" \
            --arg dispatch_nonce "$DISPATCH_NONCE" \
            --arg expected_plan_sha256 "$EXPECTED_PLAN_SHA256" \
            --arg head_sha "$HEAD_SHA" \
            --arg predecessor_sha256 "$PREDECESSOR_SHA256" \
            --arg reservation_sha256 "$RESERVATION_SHA256" \
            --argjson run_attempt "$RUN_ATTEMPT" \
            --argjson run_id "$RUN_ID" \
            '{attestation:$attestation[0],attestation_sha256:$attestation_sha256,reservation_receipt_sha256:$reservation_sha256,dispatch_nonce:$dispatch_nonce,attempt:$attempt,run_id:$run_id,run_attempt:$run_attempt,head_sha:$head_sha}' \
            > request.json
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" \
            --data-binary @request.json \
            "${MONITOR_API_URL}/internal/release/activation-evidence-verify" \
            > activation-evidence-public-receipt.json
          jq -e 'type == "object"' activation-evidence-public-receipt.json >/dev/null
          rm -f request.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: activation-evidence-${{ inputs.activation_nonce }}-generation-${{ inputs.attestation_generation }}-${{ inputs.dispatch_nonce }}-attempt-${{ inputs.attempt }}
          path: |
            activation-attestation-generation-${{ inputs.attestation_generation }}.json
            activation-evidence-public-receipt.json
          retention-days: 1
          if-no-files-found: error
