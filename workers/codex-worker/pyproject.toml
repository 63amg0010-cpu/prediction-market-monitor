[project]
name = "monitor-worker"
version = "0.1.0"
description = "Windows-host analysis queue worker boundary for the monitor."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "rich>=13.9,<14",
    "typer>=0.15,<1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.28,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false
