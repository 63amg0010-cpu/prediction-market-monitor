[project]
name = "monitor-api"
version = "0.1.0"
description = "Fail-closed FastAPI control plane for the monitor."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.30,<1",
    "cryptography>=43,<47",
    "fastapi>=0.115,<1",
    "httpx2[brotli,http2,zstd]>=2.5,<3",
    "orjson>=3.10,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "PyYAML>=6.0,<7",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.28,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false
